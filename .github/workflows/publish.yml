name: Publish

# Publishes to PyPI with Trusted Publishing (OIDC) -- there are no API tokens
# or repository secrets to manage.  See "Releasing" in the README for the
# one-time PyPI setup this expects.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

      - name: Verify the release tag matches the project version
        if: github.event_name == 'release'
        run: |
          version=$(uv run python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          echo "pyproject: $version / tag: $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::pyproject.toml version ($version) does not match the release tag ($tag)"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Check the metadata renders
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/jpml
    permissions:
      id-token: write   # mints the OIDC token PyPI trusts
      contents: read
      actions: read     # lets download-artifact fetch the build output

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/jpml
    permissions:
      id-token: write   # mints the OIDC token PyPI trusts
      contents: read
      actions: read     # lets download-artifact fetch the build output

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
